<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>정보보안 과제 모음</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Pretendard', sans-serif;
      background-color: #121212;
      color: #f0f0f0;
      padding: 30px;
      text-align: center;
      position: relative;
    }

    /* 홈 버튼 스타일 */
    .home-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: transparent;
      border: none;
      cursor: pointer;
      transition: color 0.3s ease;
      color: #66ccff;
      font-size: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1000;
    }

    .home-button:hover {
      color: #a0d8ff;
    }

    /* SVG 아이콘 크기 및 색상 */
    .home-button svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* 설명 문구 */
    .description {
      font-size: 1.1rem;
      color: #99ccffcc;
      margin-bottom: 15px;
      font-style: italic;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      letter-spacing: 0.03em;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 30px;
      color: #66ccff;
      text-shadow: 0 0 10px #66ccff99;
    }

    .assignment-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .assignment {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 15px;
      width: 260px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
    }

    .assignment:hover {
      transform: scale(1.03);
    }

    .assignment img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .assignment-title {
      margin-top: 10px;
      font-size: 1.1rem;
      color: #66ccff;
    }

    .assignment-title a {
      text-decoration: none;
      color: inherit;
    }

    .assignment-title a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- 홈 버튼 -->
  <button class="home-button" onclick="location.href='index.html'" aria-label="홈으로 이동">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
    홈
  </button>

  <!-- 설명 문구 -->
  <p class="description">
    정보보안에 열정을 가진 개발자, 실습과 프로젝트를 통해 성장하는 중입니다.
  </p>

  <h1>📘 정보보안 과제 모음</h1>

  <div class="assignment-list">
    <!-- 과제 1 -->
    <div class="assignment">
      <a href="과제1/index.html">
        <img src="practice/0813-1.png" alt="1과제 미리보기 이미지">
        <div class="assignment-title">1과제 보기</div>
      </a>
    </div>

    <!-- 과제 2 -->
    <div class="assignment">
      <a href="과제2/index.html">
        <img src="practice/0918-1.PNG" alt="2과제 미리보기 이미지">
        <div class="assignment-title">2과제 보기</div>
      </a>
    </div>

    <!-- 필요 시 추가 -->
  </div>

</body>
</html>
